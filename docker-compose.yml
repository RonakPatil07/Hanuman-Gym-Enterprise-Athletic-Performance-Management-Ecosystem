# ==============================================================================
# Hanuman Gym - Enterprise Multi-Container Docker Stack
# Production-ready orchestration with Nginx Ingress, Apache Web, FastAPI,
# PostgreSQL 16, and Database Administration tooling.
#
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Nginx Ingress Gateway (Reverse Proxy & SSL Termination)
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: hanuman_gym_gateway
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - gym_frontend_net
      - gym_backend_net

  # ----------------------------------------------------------------------------
  # 2. Web Frontend Service (Apache + PHP 8.2)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hanuman_gym_web
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-gym_website}
      - DB_USER=${POSTGRES_USER:-gym_admin}
      - DB_PASS=${POSTGRES_PASSWORD:-gym_secure_pass_2026}
      - SUPABASE_URL=${SUPABASE_URL:-https://bmtrmqxahxpjldvfgajg.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtdHJtcXhhaHhwamxkdmZnYWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzgzMTcsImV4cCI6MjA5MDk1NDMxN30.T38QIPnA99L1-G2PdXqknkhhcP6mJ0Yum8-U4HfxWzg}
    networks:
      - gym_frontend_net
      - gym_backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend Microservice (Python 3.11)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hanuman_gym_api
    restart: unless-stopped
    environment:
      - PROJECT_NAME="Hanuman Gym API"
      - VERSION="1.0.0"
      - DEBUG=${DEBUG:-False}
      - HOST="0.0.0.0"
      - PORT=8000
      - SECRET_KEY=${JWT_SECRET_KEY:-hanuman_gym_production_secret_key_2026_super_secure}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-gym_admin}:${POSTGRES_PASSWORD:-gym_secure_pass_2026}@db:5432/${POSTGRES_DB:-gym_website}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gym_backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Relational Database Service (PostgreSQL 16 Alpine)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hanuman_gym_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gym_website}
      POSTGRES_USER: ${POSTGRES_USER:-gym_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym_secure_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-import schema upon initial volume creation
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PORT_DB:-5432}:5432"
    networks:
      - gym_backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gym_admin} -d ${POSTGRES_DB:-gym_website}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. Visual Database Management Web UI (Adminer)
  # ----------------------------------------------------------------------------
  db_admin:
    image: adminer:latest
    container_name: hanuman_gym_adminer
    restart: unless-stopped
    ports:
      - "${PORT_ADMINER:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - gym_backend_net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Network Topology
# ------------------------------------------------------------------------------
networks:
  gym_frontend_net:
    driver: bridge
  gym_backend_net:
    driver: bridge
